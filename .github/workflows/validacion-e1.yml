name: Validación E1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e1.txt
      - run: python -m pip install -r requirements-e1.txt
      - run: python -m ruff check pipeline laboratorio tools/perfilar_sniim.py tests
      - run: python -m unittest discover -s tests
      - run: python -m pipeline.e1
      - run: python -m laboratorio.pronostico
      - run: python -m laboratorio.tablero
      - uses: actions/upload-artifact@v4
        with:
          name: evidencia-e1
          path: |
            data/oro/pronostico/
            data/oro/calidad.json
            data/cuarentena/
      - name: Auditar dependencias de E1
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-e1.txt
      - name: Revisar secretos en el historial
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
