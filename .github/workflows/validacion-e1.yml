name: Validación E1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-e1.txt
      - run: python -m pip install -r requirements-e1.txt
      - run: python -m ruff check pipeline laboratorio tools/perfilar_sniim.py tests
      - run: python -m unittest discover -s tests
      - run: python -m pipeline.e1
      - run: python -m laboratorio.pronostico
