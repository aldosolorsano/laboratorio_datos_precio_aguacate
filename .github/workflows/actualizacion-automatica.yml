name: Actualización Semanal Automática de Precios y Tablero

on:
  schedule:
    # Se ejecuta automáticamente todos los lunes a las 14:00 UTC (8:00 AM CDMX / 7:00 AM Colima)
    # Justo cuando las centrales de abasto y Banxico consolidan la nueva semana operativa
    - cron: "0 14 * * 1"
  workflow_dispatch: # Permite ejecutarlo manualmente en cualquier momento desde la web de GitHub sin terminal

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar-mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias optimizadas (E3 + Scraping)
        run: |
          pip install -r requirements-e3.txt
          pip install -r requirements-sniim.txt
          playwright install --with-deps chromium

      - name: 1. Extraer clima actualizado (Open-Meteo)
        run: python src/extractores/openmeteo.py || echo "Aviso: Clima omitido o sin cambios"

      - name: 2. Extraer tipo de cambio FIX actualizado (Banxico SIE)
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/extractores/banxico.py || echo "Aviso: Banxico omitido (usando último valor histórico disponible)"

      - name: 3. Extraer cotizaciones mayoristas recientes (SNIIM)
        run: python src/extractores/sniim.py || echo "Aviso: SNIIM omitido o sin conexión en este momento"

      - name: 4. Extraer pulso y menciones públicas de redes sociales (Mastodon API oficial)
        run: python src/extractores/redes_sociales.py

      - name: 5. Ejecutar Pipeline Optimizado E3 (Curación y Dataset Abierto)
        run: python -m pipeline.e3

      - name: 6. Entrenar y actualizar modelos de pronóstico (ARIMA/Holt)
        run: python -m laboratorio.pronostico

      - name: 7. Generar Tablero Web Visual Interactivo (data/oro y docs/index.html)
        run: python -m laboratorio.tablero

      - name: 8. Validar integridad de datos con pruebas automatizadas
        run: pytest tests/test_e1.py tests/test_e2.py tests/test_e3.py

      - name: 9. Guardar y publicar datos actualizados en el repositorio
        run: |
          git config user.name "Aldo Israel Solorzano Sanchez"
          git config user.email "23460534@colima.tecnm.mx"
          git add data/ docs/
          git diff --cached --quiet || (git commit -m "chore(cron): actualización semanal de mercado, pronósticos y tablero $(date -u +%F) [skip ci]" && git pull --rebase && git push)

      - name: 10. Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

  desplegar-github-pages:
    needs: actualizar-mercado
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar sitio web a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
