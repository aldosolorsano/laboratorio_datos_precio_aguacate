name: captura-sniim
on:
  schedule:
    - cron: "0 13 * * 1"   # lunes 13:00 UTC (ultimos 60 dias)
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial AAAA-MM-DD (vacio = ultimos 60 dias)"
        required: false
permissions:
  contents: write
jobs:
  sniim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-sniim.txt
          playwright install --with-deps chromium
      - name: Capturar SNIIM
        env:
          SNIIM_DESDE: ${{ github.event.inputs.desde }}
        run: |
          if [ -z "$SNIIM_DESDE" ]; then unset SNIIM_DESDE; fi
          python src/extractores/sniim.py
      - name: Guardar datos en el repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronce
          git diff --cached --quiet || git commit -m "captura sniim $(date -u +%F)"
          git pull --rebase
          git push