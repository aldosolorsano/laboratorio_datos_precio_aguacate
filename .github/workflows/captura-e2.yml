name: captura-e2
on:
  schedule:
    - cron: "0 13 * * *"   # diario 13:00 UTC (1 hora después de E1)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capturar-e2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-e2.txt

      - name: Open-Meteo
        run: python src/extractores/openmeteo.py

      - name: Banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/extractores/banxico.py

      - name: INEGI
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          INEGI_INDICADOR: ${{ secrets.INEGI_INDICADOR }}
        run: python src/extractores/inegi.py

      - name: Reddit Métricas
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python src/extractores/reddit.py

      - name: Pipeline E2
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m pipeline.e2

      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronce data/oro/linaje.json data/oro/calidad_e2.json data/oro/calidad.json
          git diff --cached --quiet || git commit -m "captura e2 $(date -u +%F)"
          git push
