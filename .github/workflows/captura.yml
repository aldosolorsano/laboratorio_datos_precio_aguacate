name: captura-bronce
on:
  schedule:
    - cron: "0 12 * * *"   # diario 12:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Open-Meteo
        run: python src/extractores/openmeteo.py
      - name: Banxico
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: python src/extractores/banxico.py
      - name: INEGI
        env:
          INEGI_TOKEN: ${{ secrets.INEGI_TOKEN }}
          INEGI_INDICADOR: ${{ secrets.INEGI_INDICADOR }}
        run: python src/extractores/inegi.py
      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bronce
          git diff --cached --quiet || git commit -m "captura bronce $(date -u +%F)"
          git push
